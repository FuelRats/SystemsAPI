version: 2
updates:
  - package-ecosystem: pip
    directory: /systems_api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # pyramid 2.1 and deform need pkg_resources from setuptools<81 (see systems_api/Dockerfile).
      - dependency-name: setuptools
        versions: [">=81"]
